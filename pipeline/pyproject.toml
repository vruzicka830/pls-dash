[project]
name = "pls-dash"
version = "0.1.0"
description = "IMLS Public Libraries Survey ETL: download, normalize, and compute peer-group benchmarks"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle core. I: import sorting (replaces isort). UP:
# pyupgrade (flag old-style syntax). B: flake8-bugbear (common footguns,
# e.g. mutable default args). Deliberately not turning on everything ruff
# offers day one — better to start with a set that's all signal and widen
# it once the codebase exists to widen it against.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
# Moderate-strict, not `strict = true`: real bar (every function typed,
# stale ignores fail) without the full strict bundle. Revisit once there's
# a codebase to test full strictness against.
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Third-party libs without inline types or stubs (e.g. pandas, once it's a
# dependency) shouldn't block `mypy pipeline/` from running at all — silence
# only the "no types available" class of error, not real bugs.
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
